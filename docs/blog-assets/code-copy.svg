  <rect width="1280" height="420" rx="22" fill="#0F172A"/><rect x="0" y="0" width="1280" height="66" rx="22" fill="#1E293B"/><circle cx="42" cy="33" r="10" fill="#FB7185"/><circle cx="72" cy="33" r="10" fill="#FBBF24"/><circle cx="102" cy="33" r="10" fill="#34D399"/><text x="145" y="41" fill="#E2E8F0" font-family="Menlo,Monaco,'SFMono-Regular',monospace" font-size="23">src/js/app.js · copy contact</text>
  <g font-family="Menlo,Monaco,'SFMono-Regular','Microsoft YaHei',monospace" font-size="22" xml:space="preserve"><g fill="#64748B"><text x="35" y="115">1</text><text x="35" y="160">2</text><text x="35" y="205">3</text><text x="35" y="250">4</text><text x="35" y="295">5</text><text x="35" y="340">6</text></g><g fill="#E2E8F0"><text x="85" y="115"><tspan fill="#C084FC">if</tspan> (navigator.clipboard?.writeText) <tspan fill="#C084FC">await</tspan> navigator.clipboard.writeText(post.contact);</text><text x="85" y="160"><tspan fill="#C084FC">else</tspan> {</text><text x="85" y="205">  <tspan fill="#C084FC">const</tspan> helper = document.createElement(<tspan fill="#A7F3D0">'textarea'</tspan>);</text><text x="85" y="250">  helper.value = post.contact; document.body.append(helper);</text><text x="85" y="295">  helper.select(); document.execCommand(<tspan fill="#A7F3D0">'copy'</tspan>); helper.remove();</text><text x="85" y="340">}</text></g></g>
