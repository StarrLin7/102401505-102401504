  <g font-family="Menlo,Monaco,'SFMono-Regular','Microsoft YaHei',monospace" font-size="21" xml:space="preserve"><g fill="#64748B"><text x="35" y="115">1</text><text x="35" y="160">2</text><text x="35" y="205">3</text><text x="35" y="250">4</text><text x="35" y="295">5</text><text x="35" y="340">6</text><text x="35" y="385">7</text><text x="35" y="430">8</text><text x="35" y="475">9</text><text x="23" y="520">10</text><text x="23" y="565">11</text><text x="23" y="610">12</text></g><g fill="#E2E8F0"><text x="85" y="115"><tspan fill="#C084FC">return</tspan> read().filter((post) =&gt; {</text><text x="85" y="160">  <tspan fill="#C084FC">const</tspan> haystack = [post.name, post.category, post.location, post.place,</text><text x="85" y="205">    post.description].join(<tspan fill="#A7F3D0">' '</tspan>).toLowerCase();</text><text x="85" y="250">  <tspan fill="#C084FC">return</tspan> (!keyword || haystack.includes(keyword))</text><text x="85" y="295">    &amp;&amp; (!filters.kind || post.kind === filters.kind)</text><text x="85" y="340">    &amp;&amp; (!filters.location || post.location === filters.location)</text><text x="85" y="385">    &amp;&amp; (!filters.status || post.status === filters.status);</text><text x="85" y="430">}).sort((a, b) =&gt; {</text><text x="85" y="475">  <tspan fill="#C084FC">const</tspan> statusOrder = Number(a.status === <tspan fill="#A7F3D0">'resolved'</tspan>)</text><text x="85" y="520">    - Number(b.status === <tspan fill="#A7F3D0">'resolved'</tspan>);</text><text x="85" y="565">  <tspan fill="#C084FC">return</tspan> statusOrder || b.createdAt - a.createdAt;</text><text x="85" y="610">});</text></g></g>
