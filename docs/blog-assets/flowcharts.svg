<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1550" viewBox="0 0 1440 1550" role="img" aria-labelledby="title desc">
  <title id="title">校园失物招领系统的整体数据流、发布与状态更新流程</title>
  <desc id="desc">三张规范流程图，分别说明页面与数据层的数据流、发布信息流程、状态更新流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#3B82F6"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/></marker>
    <style>
      .panel{fill:#fff;stroke:#CBD5E1;stroke-width:2}.title{font:700 30px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#0F172A}.note{font:400 21px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.node{fill:#EFF6FF;stroke:#3B82F6;stroke-width:2}.node-ok{fill:#ECFDF5;stroke:#10B981;stroke-width:2}.node-warn{fill:#FFF7ED;stroke:#F97316;stroke-width:2}.node-text{font:600 24px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#1E3A5F;text-anchor:middle;dominant-baseline:middle}.small{font:500 20px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155;text-anchor:middle}.line{stroke:#3B82F6;stroke-width:3;fill:none;marker-end:url(#arrow)}.gray{stroke:#64748B;stroke-width:3;fill:none;marker-end:url(#arrowGray)}.label{font:600 19px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1440" height="1550" fill="#F8FAFC"/>

  <!-- 图 1 -->
  <rect class="panel" x="50" y="40" width="1340" height="410" rx="22"/>
  <text class="title" x="90" y="95">图 1　整体数据流图</text>
  <text class="note" x="90" y="130">页面层统一调用数据层，数据层是浏览器存储的唯一入口。</text>
  <rect class="node" x="105" y="215" width="290" height="95" rx="16"/>
  <text class="node-text" x="250" y="255">首页 · 搜索 · 发布</text><text class="small" x="250" y="286">详情 · 我的发布</text>
  <rect class="node" x="535" y="215" width="300" height="95" rx="16"/>
  <text class="node-text" x="685" y="255">app.js</text><text class="small" x="685" y="286">渲染与事件绑定</text>
  <rect class="node-ok" x="965" y="215" width="300" height="95" rx="16"/>
  <text class="node-text" x="1115" y="255">store.js</text><text class="small" x="1115" y="286">校验 · 筛选 · 状态更新</text>
  <path class="line" d="M395 263 H525"/><path class="line" d="M835 263 H955"/>
  <ellipse cx="1115" cy="365" rx="148" ry="42" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <path d="M967 365 C967 388 1263 388 1263 365" fill="none" stroke="#64748B" stroke-width="2"/>
  <text class="node-text" x="1115" y="359">localStorage</text><text class="small" x="1115" y="386">帖子数据</text>
  <path class="gray" d="M1115 310 V323"/><path class="gray" d="M1070 323 V310"/>
  <text class="label" x="850" y="245">统一调用</text><text class="label" x="1160" y="335">读 / 写</text>

  <!-- 图 2 -->
  <rect class="panel" x="50" y="495" width="1340" height="500" rx="22"/>
  <text class="title" x="90" y="550">图 2　发布信息流程图</text>
  <text class="note" x="90" y="585">在进入存储前完成字段与手机号码校验；校验失败返回表单修正。</text>
  <rect class="node" x="100" y="690" width="200" height="82" rx="16"/><text class="node-text" x="200" y="731">进入发布页</text>
  <rect class="node" x="350" y="690" width="200" height="82" rx="16"/><text class="node-text" x="450" y="720">选择寻物</text><text class="small" x="450" y="748">或招领</text>
  <rect class="node" x="600" y="675" width="255" height="112" rx="16"/><text class="node-text" x="727" y="713">填写表单</text><text class="small" x="727" y="744">名称、地点、时间等</text>
  <path class="node" d="M1035 658 L1145 731 L1035 804 L925 731 Z"/>
  <text class="node-text" x="1035" y="720">校验</text><text class="small" x="1035" y="748">通过？</text>
  <rect class="node-ok" x="1165" y="855" width="180" height="88" rx="16"/><text class="node-text" x="1255" y="889">写入数据</text><text class="small" x="1255" y="916">并跳转详情页</text>
  <rect class="node-warn" x="725" y="855" width="230" height="88" rx="16"/><text class="node-text" x="840" y="887">提示错误</text><text class="small" x="840" y="916">返回表单修正</text>
  <path class="line" d="M300 731 H340"/><path class="line" d="M550 731 H590"/><path class="line" d="M855 731 H915"/>
  <path class="line" d="M1115 765 C1128 825 1166 855 1180 855"/><text class="label" x="1142" y="820">是</text>
  <path d="M1000 783 C950 830 912 855 900 855" class="gray"/><text class="label" x="945" y="820">否</text>
  <path d="M725 900 C590 900 570 823 650 787" class="gray"/>

  <!-- 图 3 -->
  <rect class="panel" x="50" y="1040" width="1340" height="460" rx="22"/>
  <text class="title" x="90" y="1095">图 3　状态更新流程图</text>
  <text class="note" x="90" y="1130">只有发布者且信息尚未解决时可以更新状态；更新后各个界面重新渲染。</text>
  <rect class="node" x="95" y="1260" width="230" height="88" rx="16"/><text class="node-text" x="210" y="1294">我的发布</text><text class="small" x="210" y="1320">或信息详情</text>
  <path class="node" d="M520 1225 L655 1304 L520 1383 L385 1304 Z"/>
  <text class="node-text" x="520" y="1293">本人且</text><text class="small" x="520" y="1320">未解决？</text>
  <rect class="node-warn" x="710" y="1195" width="245" height="88" rx="16"/><text class="node-text" x="832" y="1229">仅浏览</text><text class="small" x="832" y="1256">联系发布者</text>
  <rect class="node-ok" x="710" y="1360" width="245" height="88" rx="16"/><text class="node-text" x="832" y="1392">标记已找到</text><text class="small" x="832" y="1420">或已归还</text>
  <rect class="node-ok" x="1045" y="1360" width="245" height="88" rx="16"/><text class="node-text" x="1167" y="1390">更新状态</text><text class="small" x="1167" y="1420">重新渲染与排序</text>
  <path class="line" d="M325 1304 H375"/><path class="gray" d="M610 1265 H700"/><text class="label" x="650" y="1246">否</text>
  <path class="line" d="M580 1350 L700 1398"/><text class="label" x="647" y="1394">是</text><path class="line" d="M955 1404 H1035"/>
</svg>
