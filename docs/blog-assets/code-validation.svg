  <text x="145" y="41" fill="#E2E8F0" font-family="Menlo,Monaco,'SFMono-Regular',monospace" font-size="23">src/js/store.js · validatePost</text>
  <g font-family="Menlo,Monaco,'SFMono-Regular','Microsoft YaHei',monospace" font-size="22" xml:space="preserve"><g fill="#64748B"><text x="35" y="115">1</text><text x="35" y="160">2</text><text x="35" y="205">3</text><text x="35" y="250">4</text><text x="35" y="295">5</text><text x="35" y="340">6</text><text x="35" y="385">7</text><text x="35" y="430">8</text><text x="35" y="475">9</text><text x="23" y="520">10</text></g><g fill="#E2E8F0"><text x="85" y="115"><tspan fill="#C084FC">function</tspan> validatePost(input) {</text><text x="85" y="160">  <tspan fill="#C084FC">const</tspan> required = [<tspan fill="#A7F3D0">'kind'</tspan>, <tspan fill="#A7F3D0">'name'</tspan>, <tspan fill="#A7F3D0">'category'</tspan>, <tspan fill="#A7F3D0">'location'</tspan>, <tspan fill="#A7F3D0">'place'</tspan>,</text><text x="85" y="205">    <tspan fill="#A7F3D0">'happenedAt'</tspan>, <tspan fill="#A7F3D0">'description'</tspan>, <tspan fill="#A7F3D0">'contact'</tspan>];</text><text x="85" y="250">  <tspan fill="#C084FC">const</tspan> missing = required.filter((key) =&gt; !String(input[key] ?? <tspan fill="#A7F3D0">''</tspan>).trim());</text><text x="85" y="295">  <tspan fill="#C084FC">if</tspan> (missing.length) <tspan fill="#C084FC">return</tspan> { valid: <tspan fill="#FCA5A5">false</tspan>, message: <tspan fill="#A7F3D0">'请完整填写必填信息。'</tspan>, missing };</text><text x="85" y="340">  <tspan fill="#C084FC">if</tspan> (!<tspan fill="#FDE68A">/^1\d{10}$/</tspan>.test(String(input.contact).trim())) {</text><text x="85" y="385">    <tspan fill="#C084FC">return</tspan> { valid: <tspan fill="#FCA5A5">false</tspan>, message: <tspan fill="#A7F3D0">'请填写 11 位手机号码。'</tspan>, missing: [<tspan fill="#A7F3D0">'contact'</tspan>] };</text><text x="85" y="430">  }</text><text x="85" y="475">  <tspan fill="#C084FC">return</tspan> { valid: <tspan fill="#86EFAC">true</tspan>, message: <tspan fill="#A7F3D0">''</tspan> };</text><text x="85" y="520">}</text></g></g>
